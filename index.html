<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invaders</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0d17;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
  }
  canvas {
    background: #000;
    border: 2px solid #2a2f45;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  // --- Configuration ---
  const BASE_ROWS = 5;           // formation size in wave 1
  const BASE_COLS = 8;
  const MAX_ROWS = 7;            // formation size cap for later waves
  const MAX_COLS = 11;
  const WAVE_SPEEDUP = 0.25;     // +25% alien speed per wave
  const START_LIVES = 3;
  const BANNER_TIME = 1.6;       // seconds the "WAVE n" / "LIFE LOST" banner shows
  const ALIEN_W = 36;
  const ALIEN_H = 24;
  const ALIEN_GAP_X = 24;
  const ALIEN_GAP_Y = 18;
  const ALIEN_STEP_DOWN = 20;
  const ALIEN_BASE_SPEED = 40;   // px per second at full formation
  const ALIEN_MAX_SPEED = 260;   // px per second when one alien is left
  const ROW_COLORS = ["#ff5a7a", "#ffb84d", "#ffe45c", "#6cf08a", "#5ac8ff"];

  const PLAYER_W = 48;
  const PLAYER_H = 18;
  const PLAYER_Y = H - 40;
  const PLAYER_SPEED = 320;

  const SHOT_W = 4;
  const SHOT_H = 14;
  const SHOT_SPEED = 520;
  const SHOT_COOLDOWN = 0.35;    // seconds between shots
  const BURST_SIZE = 3;          // max shots per press of the space bar
  const MAGAZINE = 12;           // successive shots before a forced reload
  const RELOAD_TIME = 2.0;       // seconds of forced reload
  const STREAK_RESET = 1.2;      // seconds without firing that reset the successive-shot count

  // --- State ---
  let player, shots, aliens, dir, score, state, cooldown;
  let burstCount, streak, sinceLastShot, reloadTimer;
  let lives, wave, waveTotal, bannerTimer, bannerText;
  const keys = {};

  // Build the formation for the current wave: each wave adds a column
  // (up to MAX_COLS) and every second wave adds a row (up to MAX_ROWS).
  function startWave() {
    const cols = Math.min(BASE_COLS + (wave - 1), MAX_COLS);
    const rows = Math.min(BASE_ROWS + Math.floor((wave - 1) / 2), MAX_ROWS);
    aliens = [];
    shots = [];
    const blockW = cols * ALIEN_W + (cols - 1) * ALIEN_GAP_X;
    const startX = (W - blockW) / 2;
    const startY = 70;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        aliens.push({
          x: startX + c * (ALIEN_W + ALIEN_GAP_X),
          y: startY + r * (ALIEN_H + ALIEN_GAP_Y),
          color: ROW_COLORS[r % ROW_COLORS.length],
          points: (rows - r) * 10, // top row is worth the most
        });
      }
    }
    waveTotal = aliens.length;
    dir = 1;
    showBanner(`WAVE ${wave}`);
  }

  function showBanner(text) {
    bannerText = text;
    bannerTimer = BANNER_TIME;
    state = "banner";
  }

  function reset() {
    player = { x: W / 2 - PLAYER_W / 2 };
    score = 0;
    lives = START_LIVES;
    wave = 1;
    cooldown = 0;
    burstCount = 0;
    streak = 0;
    sinceLastShot = 0;
    reloadTimer = 0;
    startWave(); // state: "banner" -> "playing" -> ... -> "lost"
  }

  // --- Input ---
  window.addEventListener("keydown", (e) => {
    if (["ArrowLeft", "ArrowRight", " ", "Spacebar"].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
    if (state === "lost" && e.key === "Enter") reset();
  });
  window.addEventListener("keyup", (e) => {
    keys[e.key] = false;
    // Releasing the space bar ends the current burst
    if (e.key === " " || e.key === "Spacebar") burstCount = 0;
  });

  // --- Update ---
  function update(dt) {
    if (state === "banner") {
      bannerTimer -= dt;
      if (bannerTimer <= 0) state = "playing";
      return;
    }
    if (state !== "playing") return;

    // Player movement
    if (keys["ArrowLeft"]) player.x -= PLAYER_SPEED * dt;
    if (keys["ArrowRight"]) player.x += PLAYER_SPEED * dt;
    player.x = Math.max(0, Math.min(W - PLAYER_W, player.x));

    // Firing
    cooldown -= dt;
    sinceLastShot += dt;
    if (reloadTimer > 0) {
      reloadTimer = Math.max(0, reloadTimer - dt);
    } else if (sinceLastShot > STREAK_RESET) {
      streak = 0;
    }
    const firing = keys[" "] || keys["Spacebar"];
    if (firing && cooldown <= 0 && reloadTimer <= 0 && burstCount < BURST_SIZE) {
      shots.push({ x: player.x + PLAYER_W / 2 - SHOT_W / 2, y: PLAYER_Y - SHOT_H });
      cooldown = SHOT_COOLDOWN;
      burstCount++;
      streak++;
      sinceLastShot = 0;
      if (streak >= MAGAZINE) {
        reloadTimer = RELOAD_TIME;
        streak = 0;
      }
    }

    // Shots
    for (const s of shots) s.y -= SHOT_SPEED * dt;
    shots = shots.filter((s) => s.y + SHOT_H > 0);

    // Aliens: speed up as the formation shrinks, and with every wave
    const t = 1 - (aliens.length - 1) / (waveTotal - 1);
    const waveFactor = 1 + WAVE_SPEEDUP * (wave - 1);
    const speed = (ALIEN_BASE_SPEED + (ALIEN_MAX_SPEED - ALIEN_BASE_SPEED) * t * t) * waveFactor;
    const dx = speed * dt * dir;

    let minX = Infinity, maxX = -Infinity;
    for (const a of aliens) {
      minX = Math.min(minX, a.x + dx);
      maxX = Math.max(maxX, a.x + dx + ALIEN_W);
    }

    if (minX < 10 || maxX > W - 10) {
      // Hit an edge: reverse and step down
      dir = -dir;
      for (const a of aliens) a.y += ALIEN_STEP_DOWN;
    } else {
      for (const a of aliens) a.x += dx;
    }

    // Collisions: shots vs aliens
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i];
      for (let j = aliens.length - 1; j >= 0; j--) {
        const a = aliens[j];
        if (s.x < a.x + ALIEN_W && s.x + SHOT_W > a.x &&
            s.y < a.y + ALIEN_H && s.y + SHOT_H > a.y) {
          score += a.points;
          aliens.splice(j, 1);
          shots.splice(i, 1);
          break;
        }
      }
    }

    // End conditions
    if (aliens.length === 0) {
      wave++;
      startWave();
      return;
    }
    for (const a of aliens) {
      if (a.y + ALIEN_H >= PLAYER_Y) {
        lives--;
        if (lives <= 0) {
          state = "lost";
        } else {
          // Restart the current wave from the top
          startWave();
          bannerText = `LIFE LOST - WAVE ${wave}`;
        }
        return;
      }
    }
  }

  // --- Drawing ---
  function drawPlayer() {
    const x = player.x, y = PLAYER_Y;
    ctx.fillStyle = "#7df9ff";
    ctx.fillRect(x, y + 8, PLAYER_W, PLAYER_H - 8);
    ctx.fillRect(x + 6, y + 4, PLAYER_W - 12, 4);
    ctx.fillRect(x + PLAYER_W / 2 - 4, y - 4, 8, 8);
  }

  function drawAlien(a, frame) {
    const x = a.x, y = a.y;
    ctx.fillStyle = a.color;
    // body
    ctx.fillRect(x + 6, y + 4, ALIEN_W - 12, ALIEN_H - 10);
    ctx.fillRect(x, y + 8, ALIEN_W, 8);
    // antennae
    ctx.fillRect(x + 8, y, 4, 4);
    ctx.fillRect(x + ALIEN_W - 12, y, 4, 4);
    // legs (two-frame wiggle)
    if (frame) {
      ctx.fillRect(x + 2, y + ALIEN_H - 6, 6, 6);
      ctx.fillRect(x + ALIEN_W - 8, y + ALIEN_H - 6, 6, 6);
    } else {
      ctx.fillRect(x + 10, y + ALIEN_H - 6, 6, 6);
      ctx.fillRect(x + ALIEN_W - 16, y + ALIEN_H - 6, 6, 6);
    }
    // eyes
    ctx.fillStyle = "#000";
    ctx.fillRect(x + 11, y + 9, 4, 4);
    ctx.fillRect(x + ALIEN_W - 15, y + 9, 4, 4);
  }

  function drawCenteredText(text, y, size, color) {
    ctx.fillStyle = color;
    ctx.font = `bold ${size}px "Courier New", monospace`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, W / 2, y);
  }

  function draw(time) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    // ground line
    ctx.fillStyle = "#2a2f45";
    ctx.fillRect(0, H - 14, W, 2);

    const frame = Math.floor(time / 400) % 2 === 0;
    for (const a of aliens) drawAlien(a, frame);

    ctx.fillStyle = "#fff";
    for (const s of shots) ctx.fillRect(s.x, s.y, SHOT_W, SHOT_H);

    drawPlayer();

    // Score (top left)
    ctx.fillStyle = "#fff";
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText(`SCORE: ${score}`, 16, 16);

    // Lives as small ships under the score
    ctx.fillStyle = "#7df9ff";
    for (let i = 0; i < lives; i++) {
      const lx = 16 + i * 30, ly = 46;
      ctx.fillRect(lx, ly + 4, 22, 6);
      ctx.fillRect(lx + 3, ly + 2, 16, 2);
      ctx.fillRect(lx + 9, ly - 1, 4, 3);
    }

    // Wave number (top center)
    ctx.fillStyle = "#aaa";
    ctx.textAlign = "center";
    ctx.fillText(`WAVE ${wave}`, W / 2, 16);
    ctx.textAlign = "left";

    // Ammo / reload indicator (top right)
    const pipW = 6, pipH = 14, pipGap = 4;
    const pipsX = W - 16 - MAGAZINE * (pipW + pipGap) + pipGap;
    if (reloadTimer > 0) {
      ctx.fillStyle = "#ff5a7a";
      ctx.textAlign = "right";
      ctx.fillText("RELOADING", pipsX - 12, 16);
      const progress = 1 - reloadTimer / RELOAD_TIME;
      ctx.fillStyle = "#2a2f45";
      ctx.fillRect(pipsX, 19, W - 16 - pipsX, pipH);
      ctx.fillStyle = "#ffb84d";
      ctx.fillRect(pipsX, 19, (W - 16 - pipsX) * progress, pipH);
    } else {
      for (let i = 0; i < MAGAZINE; i++) {
        ctx.fillStyle = i < MAGAZINE - streak ? "#7df9ff" : "#2a2f45";
        ctx.fillRect(pipsX + i * (pipW + pipGap), 19, pipW, pipH);
      }
    }

    if (state === "banner") {
      const color = bannerText.startsWith("LIFE LOST") ? "#ff5a7a" : "#6cf08a";
      drawCenteredText(bannerText, H / 2, 40, color);
    } else if (state === "lost") {
      ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
      ctx.fillRect(0, 0, W, H);
      drawCenteredText("GAME OVER", H / 2 - 30, 48, "#ff5a7a");
      drawCenteredText(`Final score: ${score}  -  Wave ${wave}`, H / 2 + 20, 22, "#fff");
      drawCenteredText("Press Enter to play again", H / 2 + 56, 18, "#aaa");
    }
  }

  // --- Main loop ---
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05); // clamp to avoid jumps after tab switch
    last = now;
    update(dt);
    draw(now);
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
